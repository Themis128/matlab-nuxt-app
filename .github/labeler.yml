frontend:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/**'
          - 'components/**'
          - 'nuxt.config.ts'

python:
  - changed-files:
      - any-glob-to-any-file:
          - 'python_api/**'

docs:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - 'README.md'

ml:
  - changed-files:
      - any-glob-to-any-file:
          - 'scripts/**'
          - 'scripts/**/*.py'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
